<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#2c1a55"/><stop offset=".5" stop-color="#140d31"/><stop offset="1" stop-color="#05040c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd76b" stop-opacity=".75"/><stop offset=".35" stop-color="#ffb347" stop-opacity=".28"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="36%" r="64%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".28" stop-color="#fff4cf"/><stop offset=".62" stop-color="#ffc940"/><stop offset="1" stop-color="#ff9b3a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset=".55" stop-color="#9ff0e0"/><stop offset="1" stop-color="#3fd6e8"/>
    </linearGradient>
    <linearGradient id="aur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd6e8" stop-opacity="0"/><stop offset=".5" stop-color="#3fd6e8" stop-opacity=".35"/><stop offset="1" stop-color="#b56cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <path d="M-20 360 C 110 300, 220 410, 330 350 S 500 300, 540 330 L 540 420 C 420 400, 330 460, 200 430 S 40 420, -20 440 Z" fill="url(#aur)" filter="url(#soft)" opacity=".8"/>
  <g fill="#cfe8ff">
    <circle cx="70" cy="80" r="2"/><circle cx="430" cy="64" r="1.6"/><circle cx="452" cy="170" r="2.2"/><circle cx="52" cy="210" r="1.4"/>
    <circle cx="120" cy="450" r="1.8"/><circle cx="400" cy="460" r="1.4"/><circle cx="300" cy="40" r="1.3"/><circle cx="180" cy="60" r="1.2"/>
  </g>
  <g id="art">
    <circle cx="256" cy="256" r="230" fill="url(#halo)"/>
    <g fill="none" stroke="url(#ring)" stroke-linecap="round" filter="url(#glow)">
      <circle cx="256" cy="256" r="196" stroke-width="3" opacity=".35" stroke-dasharray="40 22 8 22"/>
      <circle cx="256" cy="256" r="156" stroke-width="5" opacity=".6" stroke-dasharray="120 26 30 26"/>
      <circle cx="256" cy="256" r="116" stroke-width="7" opacity=".95"/>
    </g>
    <!-- the hush: dark voids drifting in -->
    <g>
      <circle cx="402" cy="128" r="30" fill="#000" opacity=".35"/>
      <circle cx="402" cy="128" r="20" fill="#08040f" stroke="#b56cff" stroke-width="3.5"/>
      <circle cx="395" cy="135" r="3.6" fill="#d9b3ff"/>
      <circle cx="108" cy="392" r="22" fill="#000" opacity=".35"/>
      <circle cx="108" cy="392" r="14" fill="#08040f" stroke="#b56cff" stroke-width="3"/>
      <circle cx="114" cy="386" r="2.6" fill="#d9b3ff"/>
      <circle cx="420" cy="360" r="15" fill="#000" opacity=".3"/>
      <circle cx="420" cy="360" r="9" fill="#08040f" stroke="#b56cff" stroke-width="2.4"/>
    </g>
    <!-- the singer -->
    <circle cx="256" cy="256" r="74" fill="#ffd76b" opacity=".5" filter="url(#soft)"/>
    <circle cx="256" cy="256" r="64" fill="url(#orb)"/>
    <circle cx="256" cy="256" r="64" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
    <!-- an eighth note inside the light -->
    <g fill="#5a2a0a" opacity=".82">
      <ellipse cx="244" cy="282" rx="17" ry="12.5" transform="rotate(-22 244 282)"/>
      <rect x="256" y="216" width="6.5" height="68" rx="3"/>
      <path d="M259 216 C 280 226, 292 236, 284 262 C 282 246, 272 238, 259 236 Z"/>
    </g>
  </g>
</svg>
